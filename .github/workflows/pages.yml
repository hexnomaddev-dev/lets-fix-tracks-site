name: GitHub Pages

on:
  pull_request:
  # Official daily archive push deployments
  push:
    branches: [main]
    paths:
      - 'daily-puzzles/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce append-only daily archive history
        shell: bash
        run: |
          git log --first-parent --full-history --diff-merges=first-parent --format= --name-status --no-renames HEAD -- daily-puzzles/ |
            awk 'NF && $1 != "A" { print "Published archive path was changed: " $0; bad=1 } END { exit bad }'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        id: pages
      - name: Build and check links
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          RELEASE_FLAG: ${{ github.event_name != 'pull_request' && '--release' || '' }}
        run: |
          node build.mjs $RELEASE_FLAG
          node check.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Reject superseded deployment snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "This snapshot was superseded. Deploy the current default branch."
            exit 1
          fi
      - uses: actions/deploy-pages@v4
        id: deployment
